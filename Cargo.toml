[package]
name = "revy"
version = "0.35.0"
authors = ["rerun.io <opensource@rerun.io>"]
categories = [
    "game-development",
    "development-tools",
    "development-tools::debugging",
]
description = "Proof-of-concept time-travel debugger for Bevy, built with Rerun."
edition = "2024"
homepage = "https://rerun.io"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
keywords = ["rerun", "bevy", "debugger", "time-travel", "gamedev"]
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/rerun-io/revy"
rust-version = "1.88"


[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]


[dependencies]
rerun = { version = "0.35.0", default-features = false, features = [
    "sdk",
    "image",
    "glam",
] }


# NOTE: `debug` used to be enabled by default (bevy <= 0.17), but bevy 0.19 slimmed down its
# default feature set and dropped it. revy relies on `ComponentInfo::name()` returning real
# component type names (via `bevy_ecs`/`bevy_utils`'s `debug` feature) for all of its name-based
# logger dispatch -- without it, every component name collapses to a placeholder string and
# nothing gets recognized, logged, or visualized correctly.
bevy = { version = "0.19", features = ["debug"] }
# bevy = { path = "../../bevyengine/bevy/" }
# `dynamic_linking` on windows hits error for maximum number of exported symbols on linking.
# On linux, you may run into libc issues depending on your system.
# bevy = { path = "../../bevyengine/bevy/", features = ["dynamic_linking"] }

itertools = "0.13"
ron = "0.8"

[dev-dependencies]
rand = "0.10"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
