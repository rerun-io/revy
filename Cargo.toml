[package]
name = "revy"
version = "0.35.0"
authors = ["rerun.io <opensource@rerun.io>"]
categories = [
    "game-development",
    "development-tools",
    "development-tools::debugging",
]
description = "Proof-of-concept time-travel debugger for Bevy, built with Rerun."
edition = "2024"
homepage = "https://rerun.io"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
keywords = ["rerun", "bevy", "debugger", "time-travel", "gamedev"]
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/rerun-io/revy"
rust-version = "1.95.0"


[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]


[dependencies]
rerun = { version = "0.35.0", default-features = false, features = [
    "sdk",
    "image",
    "glam",
] }


# NOTE: `debug` used to be enabled by default (bevy <= 0.17), but bevy 0.19 slimmed down its
# default feature set and dropped it. revy relies on `ComponentInfo::name()` returning real
# component type names (via `bevy_ecs`/`bevy_utils`'s `debug` feature) for all of its name-based
# logger dispatch -- without it, every component name collapses to a placeholder string and
# nothing gets recognized, logged, or visualized correctly.
bevy = { version = "0.19", features = ["debug"] }
# bevy = { path = "../../bevyengine/bevy/" }
# `dynamic_linking` on windows hits error for maximum number of exported symbols on linking.
# On linux, you may run into libc issues depending on your system.
# bevy = { path = "../../bevyengine/bevy/", features = ["dynamic_linking"] }

itertools = "0.13"
ron = "0.8"

[dev-dependencies]
rand = "0.10"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }

# Release optimizations + debug symbols, for profiling (`cargo flamegraph --profile profiling`).
# Plain `dev` is too slow to be representative; plain `release` strips the symbols a profiler needs.
[profile.profiling]
inherits = "release"
debug = true

[lints]
workspace = true


[workspace]

# ----------------------------------------------------------------------------------------
# Lints:

[workspace.lints.rust]
unsafe_code = "deny"

elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn" # `unsafe_op_in_unsafe_fn` may become the default in future Rust versions: https://github.com/rust-lang/rust/issues/71668
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

trivial_casts = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
all = "warn"
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

# See also clippy.toml
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

allow_attributes = "warn"
as_ptr_cast_mut = "warn"
await_holding_lock = "warn"
branches_sharing_code = "warn"
char_lit_as_u8 = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
coerce_container_to_any = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_macros = "warn" # See clippy.toml
disallowed_methods = "warn" # See clippy.toml
disallowed_names = "warn" # See clippy.toml
disallowed_script_idents = "warn" # See clippy.toml
disallowed_types = "warn" # See clippy.toml
doc_include_without_cfg = "warn"
empty_enum_variants_with_brackets = "warn"
empty_line_after_outer_attr = "warn"
equatable_if_let = "warn"
exit = "warn"
fallible_impl_from = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_let_mutex = "warn"
implied_bounds_in_impls = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
let_unit_value = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
manual_clamp = "warn"
manual_ilog2 = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_enforced_import_renames = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_pass_by_ref_mut = "warn"
needless_type_cast = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
only_used_in_recursion = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
readonly_write_lock = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
significant_drop_tightening = "warn"
set_contains_or_insert = "warn"
single_option_map = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_command_arg_space = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_arguments = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

# Pedantic lints we opt out of, mirroring https://github.com/emilk/egui/blob/main/Cargo.toml.
# Lints that were already enabled here one-by-one are kept on.
cast_lossless = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"                          # exact float comparisons are usually intentional (`float_cmp_const` is still on)
inline_always = "allow"                      # we know what we are doing
items_after_statements = "allow"
many_single_char_names = "allow"             # `r, g, b, a` and `h, s, v` are fine
missing_panics_doc = "allow"
must_use_candidate = "allow"                 # too many hits
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"                      # too many false positives, e.g. `encoder`/`encoded`
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
unreadable_literal = "allow"
used_underscore_binding = "allow"

manual_range_contains = "allow"       # this is better on 'allow'
map_unwrap_or = "allow"               # this is better on 'allow'
